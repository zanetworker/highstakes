name: HighStakes Triage
on:
  pull_request:
    # labeled/unlabeled re-run on the highstakes:signed-off label;
    # auto_merge_* re-run when auto-merge is turned on or off.
    types: [opened, synchronize, reopened, labeled, unlabeled, auto_merge_enabled, auto_merge_disabled]
  # Re-run on reviews so approvals tick the checklist.
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  pull-requests: write
  issues: write # pr signoff removes a sign-off label added before a push
  statuses: write # pr signoff records a sign-off as a commit status on the reviewed commit
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - uses: actions/cache@v4
        with:
          path: .heatmap
          key: heatmap-${{ hashFiles('**/*.go') }}
          restore-keys: heatmap-

      - name: Install highstakes
        run: go install ./cmd/highstakes

      # The highstakes:signed-off label counts only when someone with write
      # access added it, and only for the commit it was added on; a push
      # removes an older label. See `highstakes pr signoff --help`. Runs before
      # the analysis, so a failed analysis cannot leave a stale label in place.
      - name: Verify sign-off
        id: signoff
        env:
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          PUSHED_AT: ${{ github.event.pull_request.updated_at }}
        run: highstakes pr signoff --repo "$REPO" --pr "$PR" --head-sha "$HEAD_SHA" --action "$ACTION" --label "$LABEL" --pushed-at "$PUSHED_AT" >> "$GITHUB_OUTPUT"

      # Live auto-merge state, and approvals of this head commit (an approval
      # of an earlier commit does not cover new pushes), with the approvers
      # who have write access.
      - name: Read PR state
        id: state
        run: highstakes pr state --repo "$REPO" --pr "$PR" --head-sha "$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Analyze repository
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ ! -f .heatmap/config.yaml ]; then highstakes init; fi
          highstakes analyze

      # Exit 5 means the PR changes a Harden now file (--fail-on critical) and
      # before-merge items are still open. A maintainer with write access adds
      # the highstakes:signed-off label after reviewing to tick sign-off items
      # (authors cannot approve their own PRs).
      - name: Assess PR risk
        id: risk
        env:
          BASE: origin/${{ github.event.pull_request.base.ref }}
          SIGNED_OFF: ${{ steps.signoff.outputs.signed }}
          APPROVALS: ${{ steps.state.outputs.approvals }}
          MAINTAINERS: ${{ steps.state.outputs.maintainers }}
          AUTO_MERGE: ${{ steps.state.outputs.auto_merge }}
        run: |
          set +e
          signed=
          if [ "$SIGNED_OFF" = "true" ]; then signed=--signed-off; fi
          highstakes pr check --base "$BASE" --format markdown --fail-on critical --approvals "$APPROVALS" --maintainer-approvals "$MAINTAINERS" --repo "$REPO" --auto-merge-enabled "$AUTO_MERGE" $signed > pr-comment.md
          echo "code=$?" >> "$GITHUB_OUTPUT"

      # A run that saw an older head, auto-merge state, sign-off label or
      # approvals leaves the comment and the decision to the newer run.
      - name: Check the PR did not change
        id: fresh
        if: always() && steps.risk.outputs.code != ''
        env:
          AUTO_MERGE: ${{ steps.state.outputs.auto_merge }}
          LABEL_STATE: ${{ steps.signoff.outputs.label_state }}
          APPROVALS: ${{ steps.state.outputs.approvals }}
          MAINTAINERS: ${{ steps.state.outputs.maintainers }}
        run: |
          if highstakes pr fresh --repo "$REPO" --pr "$PR" --head-sha "$HEAD_SHA" --auto-merge "$AUTO_MERGE" --label-state "$LABEL_STATE" --approvals "$APPROVALS" --maintainers "$MAINTAINERS"; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post PR comment
        uses: actions/github-script@v9
        if: always() && steps.fresh.outputs.fresh == 'true'
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('pr-comment.md')) return;
            const body = fs.readFileSync('pr-comment.md', 'utf8');
            if (!body.trim()) return;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            // The marker is written by `highstakes pr check --format markdown`.
            const existing = comments.find(c => c.body.includes('<!-- highstakes-triage -->') || c.body.includes('HighStakes:'));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Gate on Harden now files
        if: always()
        env:
          CODE: ${{ steps.risk.outputs.code }}
          AUTO_MERGE: ${{ steps.state.outputs.auto_merge }}
          LABEL_STATE: ${{ steps.signoff.outputs.label_state }}
          APPROVALS: ${{ steps.state.outputs.approvals }}
          MAINTAINERS: ${{ steps.state.outputs.maintainers }}
        run: |
          if [ -z "$CODE" ]; then echo "::error::The HighStakes check did not finish; see the steps above."; exit 1; fi
          highstakes pr fresh --repo "$REPO" --pr "$PR" --head-sha "$HEAD_SHA" --auto-merge "$AUTO_MERGE" --label-state "$LABEL_STATE" --approvals "$APPROVALS" --maintainers "$MAINTAINERS" || exit 1
          case "$CODE" in
            0) exit 0 ;;
            5) echo "::error::This PR changes Harden now files with before-merge items open. Work through 'Do before merge' in the HighStakes comment." ;;
            *) echo "::error::highstakes pr check failed (exit $CODE)." ;;
          esac
          exit 1
