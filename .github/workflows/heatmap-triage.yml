name: HighStakes Triage
on:
  pull_request:
    # labeled/unlabeled re-run on the highstakes:signed-off label;
    # auto_merge_* re-run when auto-merge is turned on or off.
    types: [opened, synchronize, reopened, labeled, unlabeled, auto_merge_enabled, auto_merge_disabled]
  # Re-run on reviews so owner approvals tick the checklist.
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  pull-requests: write
  issues: write # remove the sign-off label after a new push
  statuses: write # record a sign-off as a commit status on the reviewed commit
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - uses: actions/cache@v4
        with:
          path: .heatmap
          key: heatmap-${{ hashFiles('**/*.go') }}
          restore-keys: heatmap-

      - name: Install highstakes
        run: go install ./cmd/highstakes

      - name: Analyze repository
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ ! -f .heatmap/config.yaml ]; then highstakes init; fi
          highstakes analyze

      # Each reviewer's latest review counts; logins whose latest review is an
      # approval tick the owner-review items of the checklist.
      - name: Collect approvals
        id: approvals
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          logins=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate --jq '.[] | [.user.login, .state] | @tsv' \
            | awk -F'\t' '$2 != "COMMENTED" { last[$1] = $2 } END { for (u in last) if (last[u] == "APPROVED") print u }' \
            | sort | paste -sd, -)
          echo "logins=$logins" >> "$GITHUB_OUTPUT"

      # The highstakes:signed-off label counts only when someone with write
      # access added it, and only for the commit it was given on. When such a
      # person adds the label, this records a `highstakes/signed-off` commit
      # status on the head commit; later runs trust the label only when the
      # current head carries that status, set by this workflow's bot. A new
      # push is a new commit without the status (and the label is removed).
      - name: Verify sign-off
        id: signoff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
          ADDED: ${{ github.event.label.name }}
          SENDER: ${{ github.event.sender.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PUSHED_AT: ${{ github.event.pull_request.updated_at }}
        run: |
          signed=false
          case ",$LABELS," in
            *,highstakes:signed-off,*)
              if [ "$ACTION" = "synchronize" ]; then
                # Remove the label only if it predates this push: a maintainer may
                # already have signed off on the new head while this run waited.
                labeled_at=$(gh api "repos/$REPO/issues/$PR/events" --paginate \
                  --jq '.[] | select(.event == "labeled" and .label.name == "highstakes:signed-off") | .created_at' | tail -n1)
                if [ -z "$labeled_at" ] || [[ "$labeled_at" < "$PUSHED_AT" ]]; then
                  gh api -X DELETE "repos/$REPO/issues/$PR/labels/highstakes:signed-off" >/dev/null || true
                  echo "New commits pushed: the sign-off no longer applies; review again and re-add the label."
                fi
              elif [ "$ACTION" = "labeled" ] && [ "$ADDED" = "highstakes:signed-off" ]; then
                perm=$(gh api "repos/$REPO/collaborators/$SENDER/permission" --jq .permission 2>/dev/null || echo none)
                case "$perm" in
                  admin|maintain|write)
                    gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" -f state=success -f context=highstakes/signed-off \
                      -f description="Signed off by $SENDER" >/dev/null && signed=true ;;
                  *) echo "Sign-off label added by $SENDER (permission: $perm) does not count: write access is required." ;;
                esac
              else
                n=$(gh api "repos/$REPO/commits/$HEAD_SHA/statuses" --paginate \
                  --jq '[.[] | select(.context == "highstakes/signed-off" and .state == "success" and .creator.login == "github-actions[bot]")] | length' \
                  | awk '{s += $1} END {print s + 0}')
                if [ "$n" -gt 0 ]; then signed=true; else echo "No sign-off recorded for this commit; review again and re-add the label."; fi
              fi
              ;;
          esac
          echo "signed=$signed" >> "$GITHUB_OUTPUT"

      # Exit 5 means the PR changes a Harden now file (--fail-on critical) and
      # before-merge items are still open. A maintainer with write access adds
      # the highstakes:signed-off label after reviewing to tick sign-off items
      # (authors cannot approve their own PRs). Both events carry pull_request.
      - name: Assess PR risk
        id: risk
        env:
          BASE: origin/${{ github.event.pull_request.base.ref }}
          APPROVALS: ${{ steps.approvals.outputs.logins }}
          REPO: ${{ github.repository }}
          SIGNED_OFF: ${{ steps.signoff.outputs.signed }}
          AUTO_MERGE: ${{ github.event.pull_request.auto_merge != null }}
        run: |
          set +e
          signed=
          if [ "$SIGNED_OFF" = "true" ]; then signed=--signed-off; fi
          highstakes pr check --base "$BASE" --format markdown --fail-on critical --approvals "$APPROVALS" --repo "$REPO" --auto-merge-enabled "$AUTO_MERGE" $signed > pr-comment.md
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        uses: actions/github-script@v9
        if: always()
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('pr-comment.md')) return;
            const body = fs.readFileSync('pr-comment.md', 'utf8');
            if (!body.trim()) return;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            // The marker is written by `highstakes pr check --format markdown`.
            const existing = comments.find(c => c.body.includes('<!-- highstakes-triage -->') || c.body.includes('HighStakes:'));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Gate on Harden now files
        if: steps.risk.outputs.code != '0'
        env:
          CODE: ${{ steps.risk.outputs.code }}
        run: |
          if [ "$CODE" = "5" ]; then
            echo "::error::This PR changes Harden now files with before-merge items open. Work through 'Do before merge' in the HighStakes comment."
          else
            echo "::error::highstakes pr check failed (exit $CODE)."
          fi
          exit 1
